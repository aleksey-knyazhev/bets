services:
  postgres:
    image: postgres:18
    container_name: bets-postgres
    environment:
      POSTGRES_DB: bets
      POSTGRES_USER: bets
      POSTGRES_PASSWORD: bets
    ports:
      - "5432:5432"
    volumes:
      - bets-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bets -d bets"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bets-postgres-data:
